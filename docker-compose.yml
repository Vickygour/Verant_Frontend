services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: verant-maison:latest
    container_name: verant-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional TLS + reverse proxy for a VPS deployment.
  # Uncomment, point nginx.conf at your domain, then: docker compose up -d
